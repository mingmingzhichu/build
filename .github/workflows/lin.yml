name: Compile Kernel (OnePlus 7T SM8150 Lineage 24 + BakaSU)

on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: "Clang Version"
        required: true
        type: choice
        default: clang-r563880c
        options:
          - clang-r536225   # lineage-22.2
          - clang-r547379   # lineage-23.0
          - clang-r563880c  # lineage-23.2 / 24.0 推荐

      kernel_branch:
        description: "Kernel Branch"
        required: true
        type: string
        default: "lineage-24.0"

jobs:
  Kernel_CI:
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex axel \
            libssl-dev libelf-dev libdw-dev \
            build-essential lz4 git python3 curl \
            dwarves cpio gcc-aarch64-linux-gnu

      - name: Save options
        run: |
          {
            echo "device: OnePlus 7T (hotdogb)"
            echo "soc: sm8150"
            echo "kernel_source: LineageOS/android_kernel_oneplus_sm8150"
            echo "kernel_branch: ${{ inputs.kernel_branch }}"
            echo "clang_version: ${{ inputs.clang_version }}"
            echo "ksu: BakaSU"
          } | tee -a options.txt

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ inputs.kernel_branch }} \
            https://github.com/LineageOS/android_kernel_oneplus_sm8150.git sm8150 || exit 1

      - name: Download AOSP Clang
        run: |
          case "${{ inputs.clang_version }}" in
            "clang-r536225")
              curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-qpr2-release/clang-r536225.tar.gz
              ;;
            "clang-r547379")
              curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r547379.tar.gz
              ;;
            "clang-r563880c")
              axel -o clang-r563880c.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880c.tar.gz 
              ;;
          esac
          mkdir -p toolchains/${{ inputs.clang_version }}
          tar -xf "${{ inputs.clang_version }}.tar.gz" -C "toolchains/${{ inputs.clang_version }}" || exit 1

      - name: Include BakaSU
        run: |
          cd sm8150 || exit 1
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main || exit 1

      - name: Build Kernel
        run: |
          cd sm8150 || exit 1

          export PATH="${GITHUB_WORKSPACE}/toolchains/${{ inputs.clang_version }}/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./arch/arm64/configs/vendor/sm8150-perf_defconfig
          echo "CONFIG_KSU_SUSFS=n" >> ./arch/arm64/configs/vendor/sm8150-perf_defconfig
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/vendor/sm8150-perf_defconfig
          axel https://raw.githubusercontent.com/mingmingzhichu/build/refs/heads/main/lin.patch
          axel https://raw.githubusercontent.com/mingmingzhichu/build/refs/heads/main/fix.patch
          patch -p1 < lin.patch
          #patch -p1 < fix.patch
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

          # LineageOS 官方配置
          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            vendor/sm8150-perf_defconfig vendor/oplus.config

          # 启用 KSU
          ./scripts/config --file out/.config -e KSU
          make O=out ARCH=arm64 olddefconfig

          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc --all) Image 2>&1 | tee ../build.log

          cp out/arch/arm64/boot/Image ../Image || exit 1
          cp out/.config ../.config

      - name: Create AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/do.modules=1/do.modules=0/' anykernel.sh
          sed -i 's/do.cleanup=1/do.cleanup=1/' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          cp ../Image .
          ZIP_NAME="OnePlus7T_SM8150_Lineage_${{ inputs.kernel_branch }}_BakaSU.zip"
          zip -r9 ../${ZIP_NAME} * -x "*.git*"

      - name: Upload Release
        run: |
          REL_NAME="OnePlus7T-SM8150-Lineage-lineage-24.0-BakaSU-$(date +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$REL_NAME" \
            --title "$REL_NAME" \
            --notes "$(cat options.txt)" \
            *.zip Image build.log options.txt .config
