      - name: Build Debian rootfs + boot.img (两种方式)
        run: |
          set -e
          ROOTFS_UUID="20336aa9-c9de-431a-b679-dcf10065c121"
          BASE_ADDR="0x00000000"
          KERNEL_OFFSET="0x00008000"
          TAGS_OFFSET="0x00000100"
          PAGE_SIZE="4096"
          CMDLINE="root=UUID=$ROOTFS_UUID rw rootwait clk_ignore_unused pd_ignore_unused console=ttyMSM0,115200n8 earlycon"

          rm -f rootfs.img
          dd if=/dev/zero of=rootfs.img bs=1G count=2 status=progress
          mkfs.ext4 -U "$ROOTFS_UUID" -F rootfs.img

          sudo rm -rf chroot
          sudo mkdir -p chroot
          sudo mount rootfs.img chroot

          sudo debootstrap --arch=arm64 --foreign trixie chroot http://mirrors.ustc.edu.cn/debian
          sudo cp /usr/bin/qemu-aarch64-static chroot/usr/bin/

          sudo mount --bind /proc chroot/proc
          sudo mount --bind /sys  chroot/sys
          sudo mount --bind /dev  chroot/dev
          sudo mount --bind /dev/pts chroot/dev/pts

          sudo chroot chroot /bin/bash <<'CHROOT_EOF'
          set -e
          /debootstrap/debootstrap --second-stage

          cat > /etc/apt/sources.list <<'APT_EOF'
          deb http://mirrors.ustc.edu.cn/debian trixie main contrib non-free non-free-firmware
          deb http://mirrors.ustc.edu.cn/debian trixie-updates main contrib non-free non-free-firmware
          deb http://mirrors.ustc.edu.cn/debian-security trixie-security main contrib non-free non-free-firmware
          APT_EOF

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bash-completion vim tmux network-manager chrony openssh-server \
            initramfs-tools locales sudo systemd-resolved dosfstools e2fsprogs \
            firmware-misc-nonfree

          locale-gen en_US.UTF-8 zh_CN.UTF-8
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo 'Asia/Shanghai' > /etc/timezone
          echo 'oneplus-7t' > /etc/hostname
          echo '127.0.0.1 localhost' >> /etc/hosts
          echo '127.0.1.1 oneplus-7t' >> /etc/hosts

          useradd -m -s /bin/bash -G sudo mmzc
          echo "mmzc:mmzc" | chpasswd

          cat > /etc/fstab <<'FSTAB_EOF'
          UUID=20336aa9-c9de-431a-b679-dcf10065c121  /  ext4  errors=remount-ro  0  1
          tmpfs                                      /tmp tmpfs defaults           0  0
          FSTAB_EOF

          systemctl enable ssh
          CHROOT_EOF

          # 安装内核 deb
          KERNEL_DEB=$(ls linux-image-*.deb 2>/dev/null | head -1)
          [ -z "$KERNEL_DEB" ] && KERNEL_DEB=$(ls linux-*.deb 2>/dev/null | head -1)
          echo "Installing $KERNEL_DEB"
          sudo cp "$KERNEL_DEB" chroot/tmp/kernel.deb
          sudo chroot chroot dpkg -i /tmp/kernel.deb || \
            sudo chroot chroot apt-get -y --fix-broken install

          KERNEL_VER=$(sudo chroot chroot ls /lib/modules/ | head -1)
          echo "Kernel version: $KERNEL_VER"

          # 取出内核
          sudo cp chroot/boot/vmlinuz-$KERNEL_VER /tmp/kernel.gz

          # 使用编译出来的 5.19 DTB
          DTB_PATH="kernel/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb"
          if [ ! -f "$DTB_PATH" ]; then
            echo "ERROR: $DTB_PATH not found!"
            find kernel -name "*hotdogb*.dtb" || true
            exit 1
          fi
          echo "Using DTB: $DTB_PATH"
          cp "$DTB_PATH" /tmp/dtb

          # 生成 initramfs
          sudo chroot chroot update-initramfs -c -k "$KERNEL_VER"
          sudo cp chroot/boot/initrd.img-$KERNEL_VER /tmp/initrd.img

          # ========== 方式1：拼接 DTB（官方推荐） ==========
          cat /tmp/kernel.gz /tmp/dtb > /tmp/kernel_blob
          mkbootimg \
            --kernel /tmp/kernel_blob \
            --ramdisk /tmp/initrd.img \
            --base "$BASE_ADDR" \
            --kernel_offset "$KERNEL_OFFSET" \
            --tags_offset "$TAGS_OFFSET" \
            --pagesize "$PAGE_SIZE" \
            --cmdline "$CMDLINE" \
            -o boot-append.img

          # ========== 方式2：单独 --dtb + header v2 ==========
          mkbootimg \
            --header_version 2 \
            --kernel /tmp/kernel.gz \
            --ramdisk /tmp/initrd.img \
            --dtb /tmp/dtb \
            --base "$BASE_ADDR" \
            --kernel_offset "$KERNEL_OFFSET" \
            --tags_offset "$TAGS_OFFSET" \
            --pagesize "$PAGE_SIZE" \
            --cmdline "$CMDLINE" \
            -o boot-dtb.img

          # ========== 生成禁用 AVB 的 vbmeta ==========
          # 如果系统没有 avbtool，就装一下
          if ! command -v avbtool >/dev/null 2>&1; then
            sudo apt-get install -y android-sdk-libsparse-utils || true
            # 备用：直接用 python 版（很多环境自带）
            pip3 install --user avbtool || true
          fi

          # 优先用系统 avbtool，没有就跳过
          if command -v avbtool >/dev/null 2>&1; then
            avbtool make_vbmeta_image --flags 2 --padding_size 4096 -o vbmeta-disabled.img
          else
            echo "WARNING: avbtool not found, skipping vbmeta generation"
          fi

          img2simg rootfs.img rootfs.img.sparse

          sudo umount -l chroot/proc chroot/sys chroot/dev/pts chroot/dev chroot 2>/dev/null || true

      - name: Collect output
        run: |
          mkdir -p output
          cp kernel/arch/arm64/boot/Image.gz output/ || true
          cp kernel/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb output/ || true
          cp linux-*.deb output/ 2>/dev/null || true
          cp boot-append.img output/
          cp boot-dtb.img output/
          cp vbmeta-disabled.img output/ 2>/dev/null || true
          cp rootfs.img.sparse output/
          ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oneplus7t-debian-full
          path: output/
          retention-days: 7