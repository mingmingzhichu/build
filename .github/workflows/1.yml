name: Build SM8150 Mainline + Debian ESP for OnePlus7T (hotdogb)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            flex bison libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler bc cpio rsync debhelper \
            axel debootstrap qemu-user-static binfmt-support \
            python3 wget android-sdk-libsparse-utils \
            dosfstools grub-common mtools

          cd /tmp
          wget --timeout=30 --tries=3 --show-progress -O grub-efi-arm64-bin.deb \
            http://ports.ubuntu.com/ubuntu-ports/pool/main/g/grub2-unsigned/grub-efi-arm64-bin_2.06-2ubuntu14.8_arm64.deb
          echo 'b07844c4fee026737ce87d0ebf735868073656d3b78989bc5e9f2ed378af9185  grub-efi-arm64-bin.deb' | sha256sum -c -
          sudo dpkg-deb -x grub-efi-arm64-bin.deb /tmp/grub-arm64
          sudo cp -a /tmp/grub-arm64/usr/lib/grub/arm64-efi /usr/lib/grub/

          which img2simg grub-mkstandalone mkfs.vfat

      - name: Clone kernel & apply hotdogb DTS (Caleb + small fix)
        run: |
          set -e
          git clone --depth 1 https://gitlab.postmarketos.org/soc/qualcomm-sm8150/linux.git kernel
          cd kernel/arch/arm64/boot/dts/qcom
          rm -f sm8150-oneplus-common.dtsi sm8150-oneplus-hotdogb.dts
          axel -o sm8150-oneplus-common.dtsi \
            https://gitlab.com/sm8150-mainline/linux/-/raw/caleb/op7-5.19-dev/arch/arm64/boot/dts/qcom/sm8150-oneplus-common.dtsi
          axel -o sm8150-oneplus-hotdogb.dts \
            https://gitlab.com/sm8150-mainline/linux/-/raw/caleb/op7-5.19-dev/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dts

          # OTG
          sed -i 's/dr_mode = "peripheral"/dr_mode = "otg"/g' sm8150-oneplus-common.dtsi

          # 1) 修正 compatible 笔误 hotdobg -> hotdogb
          sed -i 's/oneplus,hotdobg/oneplus,hotdogb/g' sm8150-oneplus-hotdogb.dts
          sed -i 's/reg = <0x0 0x80000000 0x0 0x0>/reg = <0x0 0x80000000 0x0 0x3bb00000>/' sm8150-oneplus-common.dtsi

            # 合并 hotdogb USB-C、UFS 和触摸屏 DTS 修正
            sed -i '/#include <dt-bindings\/gpio\/gpio.h>/a#include <dt-bindings/usb/pd.h>' sm8150-oneplus-hotdogb.dts
            cat >> sm8150-oneplus-hotdogb.dts <<'DTS_EOF'

            &ufs_mem_hc {
              /delete-property/ reset-gpios;
            };

            &pm8150b_vbus {
              status = "okay";
            };

            &pm8150b_typec {
              vdd-pdphy-supply = <&vreg_l2a_3p1>;
              status = "okay";

              connector {
                compatible = "usb-c-connector";
                power-role = "dual";
                data-role = "dual";
                self-powered;

                source-pdos = <PDO_FIXED(5000, 3000,
                             PDO_FIXED_DUAL_ROLE |
                             PDO_FIXED_USB_COMM |
                             PDO_FIXED_DATA_SWAP)>;

                sink-pdos = <PDO_FIXED(5000, 3000,
                           PDO_FIXED_DUAL_ROLE |
                           PDO_FIXED_USB_COMM |
                           PDO_FIXED_DATA_SWAP)>;

                op-sink-microwatt = <10000000>;

                ports {
                  #address-cells = <1>;
                  #size-cells = <0>;

                  port@0 {
                    reg = <0>;

                    pm8150b_role_switch_in: endpoint {
                      remote-endpoint = <&usb_1_dwc3_hs>;
                    };
                  };
                };
              };
            };

            &usb_1 {
              status = "okay";
              vbus-supply = <&pm8150b_vbus>;
            };

            &i2c5 {
              status = "okay";

              touchscreen@20 {
                compatible = "syna,rmi4-s3706b-i2c", "synaptics-s3706";
                reg = <0x20>;

                interrupt-parent = <&tlmm>;
                interrupts = <122 IRQ_TYPE_LEVEL_LOW>;

                reset-gpios = <&tlmm 54 GPIO_ACTIVE_LOW>;
                vcc_1v8-supply = <&vreg_l7a_1p8>;

                touchscreen-size-x = <1080>;
                touchscreen-size-y = <2400>;
              };
            };
            DTS_EOF

      - name: Kernel config & build
        run: |
          set -e
          cd kernel
          axel -o arch/arm64/configs/hotdog_defconfig \
            https://raw.githubusercontent.com/mingmingzhichu/build/main/1.config

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- hotdog_defconfig

          JOBS=$(nproc --all)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$JOBS Image dtbs modules

          export DEB_HOST_ARCH=arm64
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- deb-pkg -j$JOBS DPKG_FLAGS="-d"

      - name: Build Debian rootfs + ESP image
        run: |
          set -e

          # ========== ESP / rootfs 参数 ==========
          ROOTFS_UUID="20336aa9-c9de-431a-b679-dcf10065c121"
          ESP_SIZE_MB=256
          ESP_IMAGE="esp.img"
          ESP_UUID="7A3B-7C11"

          CMDLINE="root=UUID=$ROOTFS_UUID rw rootwait clk_ignore_unused pd_ignore_unused console=ttyMSM0,115200n8 console=tty0 earlycon keep_bootcon no_console_suspend loglevel=8 ignore_loglevel"

          # ---------- rootfs ----------
          rm -f rootfs.img
          dd if=/dev/zero of=rootfs.img bs=1G count=2 status=progress
          mkfs.ext4 -U "$ROOTFS_UUID" -F rootfs.img

          sudo rm -rf chroot
          sudo mkdir -p chroot
          sudo mount rootfs.img chroot

          sudo debootstrap --arch=arm64 --include=ca-certificates --foreign trixie chroot http://deb.debian.org/debian/
          sudo cp /usr/bin/qemu-aarch64-static chroot/usr/bin/

          sudo mount --bind /proc chroot/proc
          sudo mount --bind /sys  chroot/sys
          sudo mount --bind /dev  chroot/dev
          sudo mount --bind /dev/pts chroot/dev/pts

          sudo chroot chroot /bin/bash <<'CHROOT_EOF'
          set -e
          /debootstrap/debootstrap --second-stage

          cat > /etc/apt/sources.list <<'APT_EOF'
          deb https://mirrors.tuna.tsinghua.edu.cn/debian/ trixie main contrib non-free non-free-firmware
          deb https://mirrors.tuna.tsinghua.edu.cn/debian/ trixie-updates main contrib non-free non-free-firmware
          deb https://mirrors.tuna.tsinghua.edu.cn/debian/ trixie-backports main contrib non-free non-free-firmware
          deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          APT_EOF

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bash-completion vim tmux network-manager chrony openssh-server \
            initramfs-tools locales sudo systemd-resolved dosfstools e2fsprogs \
            firmware-misc-nonfree

          locale-gen en_US.UTF-8 zh_CN.UTF-8
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo 'Asia/Shanghai' > /etc/timezone
          echo 'oneplus-7t' > /etc/hostname
          echo '127.0.0.1 localhost' >> /etc/hosts
          echo '127.0.1.1 oneplus-7t' >> /etc/hosts

          useradd -m -s /bin/bash -G sudo mmzc
          echo "mmzc:mmzc" | chpasswd

          cat > /etc/fstab <<'FSTAB_EOF'
          UUID=20336aa9-c9de-431a-b679-dcf10065c121  /  ext4  errors=remount-ro  0  1
          tmpfs                                      /tmp tmpfs defaults           0  0
          FSTAB_EOF

          systemctl enable ssh || true
          CHROOT_EOF

          # 安装内核 deb（排除 dbg/headers）
          KERNEL_DEB=$(ls linux-image-*.deb 2>/dev/null | grep -vE '\-dbg|\-headers' | head -1)
          if [ -z "$KERNEL_DEB" ]; then
            KERNEL_DEB=$(ls linux-*.deb 2>/dev/null | grep -vE '\-dbg|\-headers' | head -1)
          fi
          if [ -z "$KERNEL_DEB" ]; then
            echo "ERROR: valid linux-image deb not found"
            ls -lh linux-*.deb || true
            exit 1
          fi

          echo "Installing $KERNEL_DEB"
          sudo cp "$KERNEL_DEB" chroot/tmp/kernel.deb
          sudo chroot chroot dpkg -i /tmp/kernel.deb || \
            sudo chroot chroot apt-get -y --fix-broken install

          KERNEL_VER=$(sudo chroot chroot ls /lib/modules/ | head -1)
          echo "Kernel version: $KERNEL_VER"

          cp kernel/arch/arm64/boot/Image /tmp/Image

          DTB_PATH="kernel/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb"
          if [ ! -f "$DTB_PATH" ]; then
            echo "ERROR: $DTB_PATH not found!"
            find kernel -name "*hotdogb*.dtb" -o -name "*oneplus*.dtb" || true
            exit 1
          fi
          echo "Using DTB: $DTB_PATH"
          cp "$DTB_PATH" /tmp/dtb

          sudo chroot chroot update-initramfs -c -k "$KERNEL_VER"
          sudo cp chroot/boot/initrd.img-$KERNEL_VER /tmp/initrd.img

          # ========== 生成可由 ARM64 UEFI/GRUB 启动的 ESP ==========
          rm -f "$ESP_IMAGE" /tmp/BOOTAA64.EFI /tmp/grub.cfg
          dd if=/dev/zero of="$ESP_IMAGE" bs=1M count="$ESP_SIZE_MB" status=progress
          mkfs.vfat -F 32 -n EFI -i "${ESP_UUID//-/}" "$ESP_IMAGE"

          cat > /tmp/grub.cfg <<GRUB_EOF
          search --no-floppy --file --set=root /Image
          set timeout=3
          set default=0
          menuentry 'Debian trixie (OnePlus 7T)' {
              linux /Image $CMDLINE
              initrd /initrd.img
              devicetree /dtb
          }
          GRUB_EOF

          grub-mkstandalone -O arm64-efi -o /tmp/BOOTAA64.EFI \
            "boot/grub/grub.cfg=/tmp/grub.cfg"
          sudo mkdir -p /mnt/esp
          sudo mount -o loop "$ESP_IMAGE" /mnt/esp
          sudo mkdir -p /mnt/esp/EFI/BOOT
          sudo cp /tmp/BOOTAA64.EFI /mnt/esp/EFI/BOOT/BOOTAA64.EFI
          sudo cp /tmp/Image /mnt/esp/Image
          sudo cp /tmp/initrd.img /mnt/esp/initrd.img
          sudo cp /tmp/dtb /mnt/esp/dtb
          sync
          sudo umount /mnt/esp
          echo "ESP contents:"
          mdir -i "$ESP_IMAGE" ::/EFI/BOOT

          img2simg rootfs.img rootfs.img.sparse

          sudo umount -l chroot/proc chroot/sys chroot/dev/pts chroot/dev chroot 2>/dev/null || true

      - name: Collect output
        run: |
          mkdir -p output
          cp kernel/arch/arm64/boot/Image output/
          cp kernel/arch/arm64/boot/dts/qcom/sm8150-oneplus-hotdogb.dtb output/ || true
          cp linux-*.deb output/ 2>/dev/null || true
          cp esp.img output/
          cp rootfs.img.sparse output/
          ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: oneplus7t-debian-full
          path: output/
          retention-days: 7